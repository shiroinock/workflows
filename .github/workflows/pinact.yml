# Reusable: fails a PR when a workflow uses an action by a tag or branch instead of a commit SHA,
# or when code matches one of the shared ast-grep rules in static-rules/.
#
# - pinact: a tag can be moved to other code at any time; a SHA cannot. Fix it with `pinact run`.
#   The calls to shiroinock/workflows at @main are left alone (see pinact/shared.yaml); a
#   repository with its own .pinact.yaml uses that instead.
# - The shared static rules come from Claude's review findings that a static check catches cheaper
#   and sooner (see static-rules/README.md and rule-harvest.yml). Nothing is pushed: fix it
#   locally with `nix run github:shiroinock/workflows#rules -- --fix`. Rules a repository turns
#   off go in .github/static-rules-off.
#
# Both run in one job: each takes seconds, and every job is billed as at least a minute in a
# private repository. The check keeps its name (pinact / pinact), which repositories require.
# Call it from templates/pinact.yml.
#
# pinact, ast-grep and the rules come from this repository's flake at workflows_ref, so the
# versions are fixed and Renovate raises them.
name: アクションの固定と共通の静的ルール

on:
  workflow_call:
    inputs:
      workflows_ref:
        description: >-
          pinact・ast-grep・ルールと共通の設定を取ってくる shiroinock/workflows の版。この workflow を SHA で呼ぶときは、
          同じ SHA を渡す。
        type: string
        default: main

permissions: {}

jobs:
  pinact:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # check out the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - name: pinact で確かめる
        env:
          REF: ${{ inputs.workflows_ref }}
          # Only to look up the SHA of an unpinned action for the error message; read-only.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          config=.pinact.yaml
          [ -f "$config" ] || config=.github/pinact.yaml
          if [ ! -f "$config" ]; then
            config="$RUNNER_TEMP/pinact.yaml"
            curl -fsSL "https://raw.githubusercontent.com/shiroinock/workflows/$REF/pinact/shared.yaml" -o "$config"
          fi
          echo "設定:$config"
          if ! nix run "github:shiroinock/workflows/$REF#pinact" -- run --check -c "$config"; then
            echo "::error::SHA で固定していないアクションがあります。手元で \`pinact run\` を流すと固定できます(nix run github:shiroinock/workflows#pinact -- run)。"
            exit 1
          fi

      # Also after pinact failed, so that one push shows both.
      - name: 共通の静的ルールで確かめる
        if: ${{ !cancelled() }}
        env:
          REF: ${{ inputs.workflows_ref }}
        run: |
          if ! nix run "github:shiroinock/workflows/$REF#rules" -- --format github; then
            echo "::error::共通の静的ルールに引っかかるコードがあります。手元で \`nix run github:shiroinock/workflows#rules -- --fix\` を流すと、直せるものは直ります。外したいルールは .github/static-rules-off に書きます。"
            exit 1
          fi
