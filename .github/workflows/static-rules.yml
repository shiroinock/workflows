# Retired: the shared static rules now run in pinact.yml's job, which every repository calls, so
# that a push does not pay for one more job (a private repository is billed at least a minute per
# job). This stays so that the repositories which still call it keep working: the job is skipped
# (a skipped job is not billed) unless standalone is true. Delete the caller's
# .github/workflows/static-rules.yml, or pass standalone: true where pinact.yml is not called.
name: 共通の静的ルール

on:
  workflow_call:
    inputs:
      workflows_ref:
        description: >-
          ルールと ast-grep を取ってくる shiroinock/workflows の版。この workflow を SHA で呼ぶときは、
          同じ SHA を渡す。
        type: string
        default: main
      standalone:
        description: >-
          pinact.yml を呼ばないリポジトリで、ここで静的ルールを流すときだけ true にする。
          false(既定)なら何もしない(静的ルールは pinact.yml のジョブで流れる)。
        type: boolean
        default: false

permissions: {}

jobs:
  rules:
    if: inputs.standalone
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # check out the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - name: 共通の静的ルールで確かめる
        env:
          REF: ${{ inputs.workflows_ref }}
        run: |
          if ! nix run "github:shiroinock/workflows/$REF#rules" -- --format github; then
            echo "::error::共通の静的ルールに引っかかるコードがあります。手元で \`nix run github:shiroinock/workflows#rules -- --fix\` を流すと、直せるものは直ります。外したいルールは .github/static-rules-off に書きます。"
            exit 1
          fi
