# Reusable: runs Claude Code when the repository owner writes @claude in an issue, a PR comment or
# a review. Anyone else's mention does nothing, so strangers cannot spend the subscription.
# Call it from templates/claude.yml.
name: Claude

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

permissions: {}

jobs:
  claude:
    # The text is only matched here, never passed to a shell.
    if: >-
      (github.event_name == 'issue_comment' &&
        github.event.comment.author_association == 'OWNER' &&
        contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' &&
        github.event.comment.author_association == 'OWNER' &&
        contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' &&
        github.event.review.author_association == 'OWNER' &&
        contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' &&
        github.event.issue.author_association == 'OWNER' &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    # One run per issue or PR at a time; a later mention waits instead of cutting the earlier one off.
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read # read CI results on PRs
      id-token: write # the action exchanges it for the Claude GitHub App's token
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allow_fork_prs: 'false'
          # Only the owner's (and Claude's own) comments reach Claude: in a public repository anyone
          # can comment on the thread the owner calls @claude in.
          include_comments_by_actor: ${{ github.repository_owner }},claude[bot]
          additional_permissions: |
            actions: read
          # Replies follow the owner, who writes in Japanese; code, identifiers and commands stay as they are.
          claude_args: >-
            --append-system-prompt "issue・PR へのコメントと PR の本文は日本語で書く。コード・識別子・コマンド・エラーメッセージは元のまま書く。"
