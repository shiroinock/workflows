# Checks the shared workflows, templates and Renovate preset before they reach every repository:
# actionlint (with shellcheck), zizmor, pinact, renovate-config-validator. The tools and their
# versions come from flake.nix and flake.lock; `nix flake check` runs the same here and locally.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # merge-reservation-self.yml starts it on main after a merge GITHUB_TOKEN made (which sends no push).
  workflow_dispatch:

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # check out the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - run: nix flake check --print-build-logs
