# Fails a PR when a workflow uses an action by a tag or branch instead of a commit SHA, or when code
# matches the shared ast-grep rules (made from Claude's review findings that a static check catches
# cheaper). Fix them with `pinact run` (nix run github:shiroinock/workflows#pinact -- run) and
# `nix run github:shiroinock/workflows#rules -- --fix`.
# The job lives in shiroinock/workflows; change it there, not here.
name: アクションの固定

on:
  # Every PR, not only ones that touch .github: a required check has to report on all of them.
  pull_request:

permissions: {}

jobs:
  pinact:
    uses: shiroinock/workflows/.github/workflows/pinact.yml@main # zizmor: ignore[unpinned-uses] the owner's own shared jobs, followed at main on purpose
    permissions:
      contents: read
    # with:
    #   workflows_ref: <SHA> # when the uses: line above is pinned to a SHA, pass the same SHA
